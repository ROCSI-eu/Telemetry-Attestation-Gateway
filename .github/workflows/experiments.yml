name: Experimental research check

on:
  pull_request:
    paths:
      - "experiments/**"
      - "scripts/check_experiments.py"
      - ".github/workflows/experiments.yml"

permissions:
  contents: read

jobs:
  experiments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run repository-owned experiment quality gate
        run: python3 scripts/check_experiments.py
      - name: Check repository documentation
        run: python3 scripts/check_docs.py

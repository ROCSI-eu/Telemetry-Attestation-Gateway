name: Public static showcase check

on:
  pull_request:
    paths:
      - "showcase/**"
      - ".github/workflows/showcase.yml"
      - "experiments/web-console-v0/index.html"
      - "experiments/web-console-v0/authentic-evidence.json"
      - "experiments/integrated-cli-v0/evidence-results.json"

permissions:
  contents: read

jobs:
  static-showcase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Focused static-only bundle tests (no cryptographic tools)
        run: python3 -m unittest discover -s showcase -p 'test_*.py' -v
      - name: Build exact static output and validate public asset count
        run: |
          python3 showcase/build.py --out-dir "$RUNNER_TEMP/tag-showcase"
          test "$(find "$RUNNER_TEMP/tag-showcase" -maxdepth 1 -type f | wc -l)" -eq 7
          test -f "$RUNNER_TEMP/tag-showcase/404.html"
